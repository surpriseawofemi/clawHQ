name: Build

# Platform builds run on tags so that pushes do not litter the repo with artifacts.
# Every push gets a full check: Go vet, frontend typecheck, and a darwin cross-compile
# of internal/, which catches a wrong //go:build tag before it reaches a mac.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  WAILS_VERSION: v3.0.0-beta.21

jobs:
  check:
    name: Check
    # Windows, not Linux: the wails3 CLI links against GTK and WebKit, and installing
    # those headers on a bare ubuntu runner still failed here. Windows carries its
    # webview in the OS, and the same install step has succeeded on it every run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Bindings are generated from the Go services and are not tracked in git, so the
      # frontend cannot typecheck until they exist.
      - name: Generate bindings
        run: wails3 generate bindings -d frontend/bindings

      # `npm run build`, not `tsc --noEmit`: it typechecks *and* writes frontend/dist,
      # which the root package embeds. Without dist, `go vet .` dies on
      # "pattern all:frontend/dist: no matching files found".
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Typecheck the gateway plugin
        working-directory: plugin
        run: npm ci --no-audit --no-fund && npm run check

      - name: Vet Go
        run: go vet ./internal/... .

      # Catches a wrong //go:build tag here rather than at tag time on a macOS runner.
      # Only internal/ — the Wails layer needs CGO and a real mac, and the root package
      # embeds frontend/dist which does not exist until a build has run.
      - name: Cross-compile internal packages for macOS
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build ./internal/...

  version-check:
    name: Version matches tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare VERSION with the tag
        run: |
          set -euo pipefail
          FILE=$(tr -d '[:space:]' < VERSION)
          TAG=${GITHUB_REF_NAME#v}
          echo "VERSION file: $FILE"
          echo "git tag:      $TAG"
          test "$FILE" = "$TAG"             || { echo "::error::VERSION says '$FILE' but the tag is '$TAG'. The updater compares against VERSION, so a mismatch means the app misreports whether it is current."; exit 1; }

  macos:
    name: macOS (Apple Silicon)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # macos-latest runners are Apple Silicon, so a native build is already arm64.
      # A universal build would mean lipo-ing two binaries, and that is a second thing
      # that can go wrong in a bundle we cannot test from CI. The task chain installs
      # frontend deps, regenerates bindings, builds the frontend, and ad-hoc signs the
      # bundle, which Apple Silicon requires before it will execute anything at all.
      - name: Build .app
        run: wails3 task package

      # Prove the bundle can actually launch before shipping it.
      #
      # Checking the signature and architecture is not enough: a v0.1.0 build passed
      # both while CFBundleExecutable named a file that did not exist, so macOS called
      # the app "damaged or incomplete" and refused to start it. Resolve the plist the
      # way Finder does and confirm the binary it names is really there.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP=bin/ClawHQ.app
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist")
          echo "CFBundleExecutable = $EXE"
          test -f "$APP/Contents/MacOS/$EXE"             || { echo "::error::Info.plist names '$EXE' but $APP/Contents/MacOS/$EXE does not exist"; exit 1; }
          test -x "$APP/Contents/MacOS/$EXE"             || { echo "::error::$EXE is not executable"; exit 1; }
          file "$APP/Contents/MacOS/$EXE"
          file "$APP/Contents/MacOS/$EXE" | grep -q arm64             || { echo "::error::binary is not arm64"; exit 1; }
          codesign --verify --deep --strict "$APP" && echo "signature OK"
          # Launch it headless and make sure the process survives a few seconds. This
          # is the check that would have caught the broken plist.
          "$APP/Contents/MacOS/$EXE" &
          PID=$!
          sleep 5
          kill -0 $PID 2>/dev/null             || { echo "::error::the app exited within 5s of launching"; exit 1; }
          kill $PID 2>/dev/null || true
          echo "app launched and stayed alive"

      # Zip with ditto, not upload-artifact directly: the artifact action drops the
      # executable bit, which makes an .app bundle refuse to launch.
      - name: Zip the bundle
        run: |
          cd bin
          ditto -c -k --keepParent ClawHQ.app ClawHQ-darwin-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: clawhq-darwin-arm64
          path: bin/ClawHQ-darwin-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # `task build` rather than `task package`: package also drives makensis for an
      # installer, which is an extra dependency for no gain here. The portable .exe is
      # self-contained.
      - name: Build
        run: wails3 task build

      # Same naming rule as the mac asset: the updater matches on GOOS and GOARCH.
      - name: Name the artifact for the updater
        run: Copy-Item bin/ClawHQ.exe bin/ClawHQ-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: clawhq-windows-amd64
          path: bin/ClawHQ-windows-amd64.exe
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          append_body: true
          body: |
            ### macOS: first launch

            The app is ad-hoc signed, not notarized, so macOS quarantines it after
            download and refuses to open it — usually claiming it is "damaged". It is
            not. Clear the quarantine flag once:

            ```bash
            xattr -dr com.apple.quarantine /Applications/ClawHQ.app
            ```

            Notarizing properly needs a paid Apple Developer account.
